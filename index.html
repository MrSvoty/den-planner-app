<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0C10">
<title>День</title>
<!-- TEMPORARY local patch (see LOCAL_PATCHES.md): static loader for the «День» client while the bot has no
     permanent domain. The bot opens https://mrsvoty.github.io/den-planner-app/?u=<tunnel>&s=<ECDSA signature>.
     The client (app.<hash>.html, same build as /app/) is served from here; the tunnel carries only the JSON API.
     No user data, no secrets. Telegram initData is sent nowhere until the backend signature checks out. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;background:#0B0C10;color:#F1F2F5;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:light){html,body{background:#F5F6F8;color:#14161B}}
#l{white-space:pre-line;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;text-align:center}
.sp{width:36px;height:36px;border-radius:50%;border:4px solid #8B9DFF33;border-top-color:#8B9DFF;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
button{font:inherit;padding:10px 18px;border-radius:12px;border:0;background:#8B9DFF;color:#0B0C10;font-weight:700}
</style>
</head>
<body>
<div id="l"><div class="sp"></div><div id="m">Загрузка ежедневника…</div></div>
<script>
(function(){
 'use strict';
 var tg=window.Telegram&&window.Telegram.WebApp;
 try{tg&&tg.ready();tg&&tg.expand();}catch(e){}
 var box=document.getElementById('l');
 var DIRECT='Откройте ежедневник из бота: кнопка меню «Ежедневник» или команда /app.';
 function fail(msg){box.innerHTML='';var p=document.createElement('p');p.textContent=msg;box.appendChild(p);
  var r=document.createElement('button');r.textContent='Повторить';r.onclick=function(){location.reload();};box.appendChild(r);
  if(tg&&tg.close){var c=document.createElement('button');c.textContent='Закрыть';c.style.background='#8a98a6';c.onclick=function(){tg.close();};box.appendChild(c);}}
 var q=new URLSearchParams(location.search),u=(q.get('u')||'').replace(/\/+$/,''),sig=q.get('s')||'';
 // the backend URL must be signed by the bot (ECDSA P-256, private key in the bot's data/); anyone can open a tunnel
 var PUBKEY='MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEvfDzTlhnSRzNsoLPi6DBpv0vmeDmVyXI+/K8cRh20pmdW2RKkPmESQmdcnqUCLDXGSecsln/cQRLSdDJHPdbtQ==';
 var APP_FILE='app.787a19af88.html';
 if(!/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*(:\d{1,5})?$/i.test(u)||!/^[A-Za-z0-9_-]{80,90}$/.test(sig)||!PUBKEY||!(window.crypto&&crypto.subtle&&window.TextEncoder)){fail(DIRECT);return;}
 function bytes(b64){b64=b64.replace(/-/g,'+').replace(/_/g,'/');while(b64.length%4)b64+='=';var s=atob(b64),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
 var tries=0,done=false,t0=Date.now();
 var wd=setTimeout(function(){if(done)return;done=true;fail('Не удалось загрузить ежедневник: нет ответа 40 с. Проверьте интернет и откройте снова.');},40000);
 function load(){
  tries++;
  var ctl=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){ctl&&ctl.abort();},15000);
  fetch(APP_FILE,{cache:'force-cache',credentials:'omit',signal:ctl?ctl.signal:undefined}).then(function(r){
   if(!r.ok)throw Error('HTTP '+r.status);return r.text();
  }).then(function(html){
   clearTimeout(to);
   if(html.indexOf('id="cfg"')<0)throw Error('неожиданный файл приложения');
   if(done)return;done=true;clearTimeout(wd);
   var api=u+'/';
   // API base for the client + the Pinggy header on every API call (the free tunnel otherwise shows its warning page)
   var head='<script>window.DEN_API_BASE='+JSON.stringify(api)+';(function(){var f=window.fetch.bind(window),A='+JSON.stringify(api)+';'+
    'window.fetch=function(i,o){var url=typeof i==="string"?i:(i&&i.url)||"";if(url.indexOf(A)===0){o=Object.assign({},o||{});'+
    'var h=new Headers(o.headers||(typeof i!=="string"&&i.headers)||{});h.set("X-Pinggy-No-Screen","1");o.headers=h;}return f(i,o);};})();<\/script>';
   html=html.replace(/<head>/i,'<head>'+head);
   document.open();document.write(html);document.close();
  }).catch(function(e){
   clearTimeout(to);if(done)return;
   if(tries<3){setTimeout(load,1500*tries);return;}
   done=true;clearTimeout(wd);
   fail('Не удалось загрузить ежедневник. Проверьте интернет и откройте снова.\n\nПодробности: '+((e&&e.name==='AbortError')?'нет ответа 15 с':(e&&e.message||String(e))));
  });
 }
 crypto.subtle.importKey('spki',bytes(PUBKEY),{name:'ECDSA',namedCurve:'P-256'},false,['verify']).then(function(k){
  return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,bytes(sig),new TextEncoder().encode('tgp-backend:'+u));
 }).then(function(good){if(!good)throw Error('bad signature');load();})
 .catch(function(){if(done)return;done=true;clearTimeout(wd);fail(DIRECT);});
})();
</script>
</body>
</html>
