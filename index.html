<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ежедневник</title>
<!-- Static loader for the Telegram Mini App «Ежедневник» (@napominalkaMINE_bot).
     Contains no user data and no secrets. The bot opens this page as
     https://mrsvoty.github.io/den-planner-app/?u=<current backend URL>; the page fetches the app from that
     backend with the X-Pinggy-No-Screen header (so no tunnel warning page) and renders it here.
     Telegram initData (in the URL #hash) stays on this page and is sent only to the backend in X-Init-Data. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;background:#f6f5f1;color:#24323f;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#l{white-space:pre-line;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;text-align:center}
.sp{width:36px;height:36px;border-radius:50%;border:4px solid #d7dfe7;border-top-color:#3f6177;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
button{font:inherit;padding:10px 18px;border-radius:12px;border:0;background:#3f6177;color:#fff}
</style>
</head>
<body>
<div id="l"><div class="sp"></div><div id="m">Загрузка ежедневника…</div></div>
<script>
(function(){
 'use strict';
 var en=false;try{en=localStorage.getItem('tgp-lang')==='en';}catch(e){}
 var M=en?{load:'Loading planner…',stale:'Could not load the planner.',how:'Check your internet connection, close this window and open the planner again with the «Ежедневник» menu button or /app.',retry:'Try again',close:'Close',direct:'Open the planner from the bot: «Ежедневник» menu button or /app.'}
         :{load:'Загрузка ежедневника…',stale:'Не удалось загрузить ежедневник.',how:'Проверьте интернет, закройте окно и откройте ежедневник снова кнопкой меню «Ежедневник» или командой /app.',retry:'Повторить',close:'Закрыть',direct:'Откройте ежедневник из бота: кнопка меню «Ежедневник» или команда /app.'};
 var tg=window.Telegram&&window.Telegram.WebApp;
 try{tg&&tg.ready();tg&&tg.expand();}catch(e){}
 var box=document.getElementById('l');
 document.getElementById('m').textContent=M.load;
 function fail(msg){box.innerHTML='';var p=document.createElement('p');p.textContent=msg;box.appendChild(p);
  var r=document.createElement('button');r.textContent=M.retry;r.onclick=function(){location.reload();};box.appendChild(r);
  if(tg&&tg.close){var c=document.createElement('button');c.textContent=M.close;c.style.background='#8a98a6';c.onclick=function(){tg.close();};box.appendChild(c);}}
 var q=new URLSearchParams(location.search),u=(q.get('u')||'').replace(/\/+$/,''),sig=q.get('s')||'';
 // the backend URL must be signed by the bot (ECDSA P-256, key in the bot's data/); anyone can open a tunnel,
 // so the host name alone proves nothing. initData is sent nowhere until the signature checks out.
 var PUBKEY='MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEvfDzTlhnSRzNsoLPi6DBpv0vmeDmVyXI+/K8cRh20pmdW2RKkPmESQmdcnqUCLDXGSecsln/cQRLSdDJHPdbtQ==';
 var verified=false;
 if(!/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*(:\d{1,5})?$/i.test(u)||!/^[A-Za-z0-9_-]{80,90}$/.test(sig)||!PUBKEY||!(window.crypto&&crypto.subtle&&window.TextEncoder)){fail(M.direct);return;}
 function bytes(b64){b64=b64.replace(/-/g,'+').replace(/_/g,'/');while(b64.length%4)b64+='=';var s=atob(b64),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
 var APP_FILE='app.c4c6d92307.html';
 var initData=(tg&&tg.initData)||'';
 var host=u.replace(/^https:\/\//,'');
 var stage='start',tries=0,done=false,t0=Date.now();
 var msgEl=document.getElementById('m');
 function setStage(s,txt){stage=s;if(msgEl)msgEl.textContent=txt;}
 function beacon(err){if(!verified)return;try{fetch(u+'/api/clientlog',{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':initData,'X-Pinggy-No-Screen':'1'},body:JSON.stringify({stage:stage,error:String(err),ms:Date.now()-t0,tries:tries,ua:navigator.userAgent,hasInit:!!initData})}).catch(function(){});}catch(e){}}
 function hardFail(err){if(done)return;done=true;beacon(err);
  fail(M.stale+' '+M.how+'\n\n'+(en?'Details: ':'Подробности: ')+String(err)+' · '+stage+' · '+host+' · '+Math.round((Date.now()-t0)/1000)+(en?' s':' с'));}
 if(!initData){setStage('noinit','');}
 // overall watchdog: never spin forever
 var wd=setTimeout(function(){hardFail(en?'timeout 40 s':'нет ответа 40 с');},40000);
 function load(){
  tries++;
  var ctl=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){ctl&&ctl.abort();},15000);
  setStage('connect',(en?'Loading the planner…':'Загрузка ежедневника…')+(tries>1?' ('+tries+')':''));
  // the app itself (HTML/JS/CSS/i18n) is a static, versioned file on GitHub Pages; the tunnel serves only small JSON API calls
  fetch(APP_FILE,{cache:'force-cache',credentials:'omit',signal:ctl?ctl.signal:undefined}).then(function(r){
   if(!r.ok)throw Error('HTTP '+r.status);
   setStage('download',en?'Loading the planner…':'Загрузка ежедневника…');
   return r.text();
  }).then(function(html){
   clearTimeout(to);
   if(html.indexOf('id="planner-seed"')<0)throw Error(en?'unexpected server response':'неожиданный ответ сервера');
   if(done)return;done=true;clearTimeout(wd);stage='render';
   html=html.replace(/<script[^>]*telegram-web-app\.js[^>]*><\/script>/,'');
   html=html.replace(/<head>/i,'<head><script>window.TGP_API_BASE='+JSON.stringify(u+'/')+';window.TGP_LOADER_T0='+t0+';<\/script>');
   document.open();document.write(html);document.close();
  }).catch(function(e){
   clearTimeout(to);if(done)return;
   var err=(e&&e.name==='AbortError')?(en?'timeout 15 s':'нет ответа 15 с'):(e&&e.message||String(e));
   if(tries<3){setTimeout(load,1500*tries);return;}
   hardFail(err);
  });
 }
 setStage('verify',M.load);
 crypto.subtle.importKey('spki',bytes(PUBKEY),{name:'ECDSA',namedCurve:'P-256'},false,['verify']).then(function(k){
  return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,bytes(sig),new TextEncoder().encode('tgp-backend:'+u));
 }).then(function(good){
  if(!good)throw Error('bad signature');
  verified=true;load();
 }).catch(function(){if(done)return;done=true;clearTimeout(wd);fail(M.direct);});
})();
</script>
</body>
</html>
