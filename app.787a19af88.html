<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0B0C10">
<meta name="robots" content="noindex">
<title>День</title>

<script>
/* messenger SDKs only inside the messenger (Telegram passes #tgWebAppData, MAX passes #WebAppData) */
(function(){if(window.Telegram&&window.Telegram.WebApp)return;var h=location.hash,s='';try{s=sessionStorage.getItem('__telegram__initParams')||''}catch(e){}
if(/tgWebAppData/.test(h)||/tgWebAppData/.test(s))document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
else if(/(^|[#&])WebAppData=/.test(h))document.write('<script src="https://st.max.ru/js/max-web-app.js"><\/script>');})();
</script>
<style>/* «День» v5 — one geometry for light and dark; only the colour variables change.
   In Telegram/MAX the variables take the messenger's colours (platform.js), elsewhere prefers-color-scheme. */
:root{
 --bg:#F4F5F7;--surface:#FFFFFF;--surface-2:#ECEEF2;--line:#E1E4EA;--text:#14161B;--muted:#5B6270;--faint:#8A909C;
 --accent:#3D5AFE;--accent-ink:#FFFFFF;--accent-soft:#E6EAFF;--accent-text:#2A3CB8;
 --warn:#C2410C;--warn-soft:#FFF0E5;--ok:#0F8A5F;--ok-soft:#E1F5EC;--danger:#C62828;--danger-soft:#FDECEC;
 --shadow:0 10px 40px #14161B1F;--radius:18px;--tap:48px;
 --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#0B0C10;--surface:#15171D;--surface-2:#1D2028;--line:#272A33;--text:#F1F2F5;--muted:#9EA4B2;--faint:#6E7482;
 --accent:#8B9DFF;--accent-ink:#0B0C10;--accent-soft:#20264A;--accent-text:#C3CCFF;
 --warn:#FF9F5A;--warn-soft:#33200F;--ok:#3DD68C;--ok-soft:#11291F;--danger:#FF8A80;--danger-soft:#2A1416;
 --shadow:0 20px 60px #00000080;color-scheme:dark}}
:root[data-theme=dark]{
 --bg:#0B0C10;--surface:#15171D;--surface-2:#1D2028;--line:#272A33;--text:#F1F2F5;--muted:#9EA4B2;--faint:#6E7482;
 --accent:#8B9DFF;--accent-ink:#0B0C10;--accent-soft:#20264A;--accent-text:#C3CCFF;
 --warn:#FF9F5A;--warn-soft:#33200F;--ok:#3DD68C;--ok-soft:#11291F;--danger:#FF8A80;--danger-soft:#2A1416;
 --shadow:0 20px 60px #00000080;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100dvh;max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;padding-top:max(10px,env(safe-area-inset-top))}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.sync{flex:none;display:flex;align-items:center;gap:7px;min-height:var(--tap);padding:0 10px;border-radius:14px;font-size:12.5px;color:var(--muted);max-width:46%}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px var(--ok-soft)}
.sync[data-state=sending] .dot,.sync[data-state=offline] .dot,.sync[data-state=local] .dot,.sync[data-state=error] .dot{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.sync[data-state=auth] .dot,.sync[data-state=memory] .dot{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.sync span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr;overflow:hidden}
.side{display:none}
.view{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.view>section{margin-bottom:18px}

h1.title{margin:6px 4px 12px;font-size:28px;line-height:1.1;letter-spacing:-.02em}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-h.warn{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.list{display:flex;flex-direction:column;overflow:hidden}

/* ---------- task row ---------- */
.task{position:relative;display:flex;align-items:flex-start;gap:4px;padding:6px 6px 6px 2px;min-height:56px;background:var(--surface);touch-action:pan-y;transition:transform .18s ease}
.task+.task{border-top:1px solid var(--line)}
.check{width:var(--tap);height:var(--tap);flex:none;display:flex;align-items:center;justify-content:center}
.check span{width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.check svg{width:14px;height:14px;stroke:var(--accent-ink);stroke-width:3.2;fill:none;opacity:0}
.task.done .check span{background:var(--accent);border-color:var(--accent)}
.task.done .check svg{opacity:1}
.check:active span{transform:scale(.85)}
.t-main{flex:1;min-width:0;padding:7px 2px;text-align:left;display:flex;flex-direction:column;gap:4px}
.t-title{font-size:15.5px;font-weight:500;overflow-wrap:anywhere}
.task.done .t-title{color:var(--faint);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:5px;font-size:12.5px;color:var(--muted);align-items:center}
.tag{padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600}
.tag.time{background:none;padding:0;color:var(--text);font-variant-numeric:tabular-nums}
.tag.hi{background:var(--accent-soft);color:var(--accent-text)}
.tag.late{background:var(--warn-soft);color:var(--warn)}
.tag.conf{background:var(--danger-soft);color:var(--danger)}
.tag.pend{background:none;padding:0;color:var(--faint)}
.t-act{flex:none;min-width:var(--tap);height:var(--tap);border-radius:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;padding:0 8px}
.t-act:hover{background:var(--surface-2)}
.swipe-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-weight:700;font-size:14px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
details.done-box>summary{list-style:none;cursor:pointer;min-height:var(--tap);display:flex;align-items:center}
details.done-box>summary::-webkit-details-marker{display:none}

/* ---------- smart input + bottom nav ---------- */
.dock{padding:8px 12px calc(6px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.compose{display:flex;gap:8px;align-items:center}
.compose input{flex:1;min-width:0;height:var(--tap);padding:0 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:16px;outline:none}
.compose input:focus{border-color:var(--accent)}
.send{width:var(--tap);height:var(--tap);flex:none;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.send svg{stroke:var(--accent-ink)}
.preview{display:flex;flex-wrap:wrap;gap:6px;padding:6px 2px 0}
.preview:empty{display:none}
.preview button{min-height:30px;padding:0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-size:13px;font-weight:600}
.preview button::after{content:" ×";opacity:.6}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:6px}
.tabs button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:14px}
.tabs button[aria-current=page]{color:var(--accent-text)}
.tabs button[aria-current=page] svg{background:var(--accent-soft);border-radius:999px;padding:3px 16px;box-sizing:content-box}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 10px}
.cal-head h2{margin:0;font-size:20px;text-transform:capitalize}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.icon-btn:hover{background:var(--surface-2)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.day{position:relative;aspect-ratio:1;min-height:40px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:var(--surface);border:1px solid transparent}
.day.out{opacity:.35}
.day.today{border-color:var(--accent)}
.day[aria-pressed=true]{background:var(--text);color:var(--bg)}
.day .dots{position:absolute;bottom:5px;display:flex;gap:2px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.day[aria-pressed=true] .dots i{background:var(--bg)}
.day.p1{background:color-mix(in srgb,var(--ok) 22%,var(--surface))}
.day.p2{background:color-mix(in srgb,var(--ok) 42%,var(--surface))}
.day.p3{background:color-mix(in srgb,var(--ok) 64%,var(--surface))}
.day.p4{background:color-mix(in srgb,var(--ok) 86%,var(--surface));color:#0B0C10}
.day .star{position:absolute;top:1px;right:3px;font-size:10px}
.event{display:flex;gap:10px;padding:10px 14px;font-size:14px}
.event+.event,.event+.task,.task+.event{border-top:1px solid var(--line)}
.event b{color:var(--accent-text);font-weight:600;min-width:86px;font-variant-numeric:tabular-nums}

/* ---------- profile ---------- */
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:13px}
.btn{min-height:var(--tap);padding:0 18px;border-radius:14px;background:var(--surface-2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);background:var(--danger-soft)}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{min-height:var(--tap);padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.field textarea{min-height:90px;resize:vertical}
.code{font:700 28px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;text-align:center;padding:14px;border-radius:14px;background:var(--surface-2)}
.pad{padding:16px}
.muted{color:var(--muted)}

/* ---------- game ---------- */
.game{padding:16px;display:flex;flex-direction:column;gap:12px}
.lvl{display:flex;align-items:center;gap:14px}
.badge-lvl{width:58px;height:58px;border-radius:18px;flex:none;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;line-height:1}
.badge-lvl small{font-size:10px;font-weight:700;opacity:.8}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px;border-radius:14px;background:var(--surface-2);text-align:center}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted);font-size:12px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ach div{padding:10px;border-radius:14px;background:var(--surface-2);font-size:13px}
.ach div.got{background:var(--ok-soft)}
.ach div:not(.got){opacity:.55}
.ach b{display:block;font-size:13.5px}
.fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fx i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 1.1s ease-out forwards}
.fx .xp{position:absolute;font-weight:800;font-size:20px;color:var(--accent-text);animation:rise 1.1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){.fx{display:none}.task{transition:none}}

/* ---------- sheet & toast ---------- */
.scrim{position:fixed;inset:0;background:#00000080;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 14px;font-size:21px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 10px 10px 16px;border-radius:16px;background:var(--text);color:var(--bg);box-shadow:var(--shadow);font-size:14px}
.toast button{min-height:40px;padding:0 12px;border-radius:12px;color:var(--bg);font-weight:700;text-decoration:underline}
.welcome{max-width:460px;margin:8vh auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.welcome h1{font-size:34px;margin:0}

/* ---------- wide screens: two columns ---------- */
@media (min-width:900px){
 .body{grid-template-columns:340px 1fr;gap:16px;padding:0 16px}
 .side{display:block;overflow-y:auto;padding:4px 0 16px}
 .view{padding:4px 0 16px}
 .tabs{display:none}
 .dock{border-top:0;padding:10px 16px 16px;margin-left:356px}
 .scrim{align-items:center}
 .sheet{border-radius:26px}
 .side .grid7 .day{min-height:34px;font-size:13px}
 .side-nav{display:flex;gap:6px;margin-bottom:12px}
}
@media (max-width:899px){.side-nav{display:none}}
</style>
</head>
<body>
<div id="app" class="app">
 <header class="top">
  <nav class="chips" id="chips" aria-label="Ежедневники"></nav>
  <button class="sync" id="sync" data-state="local" aria-label="Синхронизация"><span class="dot"></span><span>…</span></button>
 </header>
 <div class="body">
  <aside class="side" id="side-wrap">
   <div class="side-nav"><button class="btn" data-tab="plan">План</button><button class="btn" data-tab="me">Профиль</button></div>
   <div id="side"></div>
  </aside>
  <main class="view" id="view" aria-live="polite"></main>
 </div>
 <div class="dock">
  <form class="compose" id="compose-form" autocomplete="off">
   <label for="compose" class="sr">Новая задача</label>
   <input id="compose" maxlength="500" enterkeyhint="send" placeholder="Новая задача: «завтра в 10 созвон #работа»">
   <button class="send" type="submit" aria-label="Добавить"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
  <div class="preview" id="preview" aria-label="Распознано"></div>
  <nav class="tabs" aria-label="Разделы">
   <button data-tab="plan" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>План</button>
   <button data-tab="cal"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Календарь</button>
   <button data-tab="me"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/></svg>Профиль</button>
  </nav>
 </div>
</div>

<script>/* Core: dates in the planner time zone, smart-input parser (mirror of nlp_parser.py — same cases in
   tests/parser_cases.json), plan grouping and the game rules (mirror of game.py). No DOM, no network. */
const Core = (() => {
 'use strict';
 const TZ = 'Europe/Moscow';
 const pad = n => String(n).padStart(2, '0');

 // ---------- dates (all "YYYY-MM-DD" strings are dates in the planner time zone) ----------
 function partsInTZ(ms) {
  const f = new Intl.DateTimeFormat('en-CA', {timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
   hour: '2-digit', minute: '2-digit', hourCycle: 'h23', weekday: 'short'});
  const o = {}; for (const p of f.formatToParts(new Date(ms))) o[p.type] = p.value;
  return {date: `${o.year}-${o.month}-${o.day}`, hour: +o.hour, minute: +o.minute,
   weekday: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].indexOf(o.weekday)};
 }
 const today = (now = Date.now()) => partsInTZ(now).date;
 function addDays(date, n) {
  const [y, m, d] = date.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1, d + n));
  return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`;
 }
 function weekdayOf(date) { const [y, m, d] = date.split('-').map(Number); return (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7; }
 const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
 const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
 const WD = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
 const WD_FULL = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота', 'воскресенье'];
 function human(date, now = Date.now()) {
  if (!date) return 'без даты';
  const t = today(now);
  if (date === t) return 'сегодня';
  if (date === addDays(t, 1)) return 'завтра';
  if (date === addDays(t, -1)) return 'вчера';
  const [y, m, d] = date.split('-').map(Number);
  return `${WD[weekdayOf(date)]}, ${d} ${MONTHS_GEN[m - 1]}` + (String(y) !== t.slice(0, 4) ? ` ${y}` : '');
 }
 const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/[^-A-Za-z0-9_]/g, '');

 // ---------- smart input (same grammar as nlp_parser.py) ----------
 const NUM_WORDS = {один: 1, одну: 1, одна: 1, два: 2, две: 2, три: 3, четыре: 4, пять: 5, шесть: 6, семь: 7, восемь: 8,
  девять: 9, десять: 10, пятнадцать: 15, двадцать: 20, тридцать: 30, сорок: 40, пол: 0.5, полтора: 1.5, полторы: 1.5};
 const NUM = '(\\d+|' + Object.keys(NUM_WORDS).sort((a, b) => b.length - a.length).join('|') + ')';
 const HOUR_WORDS = {час: 1, два: 2, три: 3, четыре: 4, пять: 5, шесть: 6, семь: 7, восемь: 8, девять: 9, десять: 10, одиннадцать: 11, двенадцать: 12};

 async function refreshMe() { const me = await Sync.call('api/me'); S.me = me; S.planners = me.planners; await Store.setMeta({planners: me.planners, me}); Sync.run(); render(); }

 function groupSheet(id) {
  const g = planner(id); if (!g) return closeSheet();
  const act = async (fn, msg) => { try { await fn(); await refreshMe(); groupSheet(id); if (msg) toast(msg); } catch (e) { toast('Не получилось: ' + e.message); } };
  const members = h('div', {class: 'card', style: 'margin-bottom:12px'}, g.members.map(m => {

    h('option', {value: 'member', selected: m.role === 'member'}, 'участник'), h('option', {value: 'admin', selected: m.role === 'admin'}, 'админ'));
   const kick = m.id !== S.uid && m.role !== 'owner' && (g.role === 'owner' || (g.role === 'admin' && m.role === 'member'));
   return h('div', {class: 'row'}, h('span', {class: 'grow', text: m.name + (m.id === S.uid ? ' (вы)' : '')}), ctl,
    kick ? h('button', {class: 'btn danger', 'aria-label': 'Убрать ' + m.name, onclick: () => act(() => Sync.call(`api/groups/${id}/members/${m.id}`, {method: 'DELETE'}))}, '✕') : null);
  }));
  const inviteLink = g.code && S.me && S.me.bot ? `https://t.me/${S.me.bot}?start=fam_${g.code}` : null;
  sheet((g.kind === 'team' ? '🏢 ' : '👨‍👩‍👧 ') + g.name, h('div', null,
   g.code ? h('div', {class: 'card pad', style: 'margin-bottom:12px'}, h('div', {class: 'muted', text: 'Код приглашения'}), h('div', {class: 'code', text: g.code}),
    h('div', {class: 'btns', style: 'margin-top:10px'}, inviteLink ? h('button', {class: 'btn', onclick: () => navigator.clipboard && navigator.clipboard.writeText(inviteLink).then(() => toast('Ссылка скопирована')), text: 'Скопировать ссылку'}) : null,
     g.can_manage ? h('button', {class: 'btn', onclick: () => confirm('Старый код перестанет работать. Продолжить?') && act(() => Sync.call(`api/groups/${id}/code`, {method: 'POST', body: '{}'})), text: 'Новый код'}) : null))
    : h('p', {class: 'muted', text: 'Приглашать могут владелец и админы.'}),
   h('div', {class: 'sec-h', text: `Участники · ${g.members.length}`}), members,
   g.can_manage && g.kind === 'team' ? h('label', {class: 'row'}, h('input', {type: 'checkbox', checked: g.open_invite, onchange: e => act(() => Sync.call(`api/groups/${id}`, {method: 'PUT', body: JSON.stringify({open_invite: e.target.checked})}))}), h('span', {text: 'Приглашать могут все участники'})) : null,
   h('div', {class: 'btns', style: 'margin-top:12px'}, h('button', {class: 'btn primary', onclick: () => { S.filter = id; S.tab = 'plan'; closeSheet(); render(); }, text: 'Открыть дела'}),
    h('button', {class: 'btn danger', onclick: () => confirm('Выйти из группы?') && act(async () => { await Sync.call(`api/groups/${id}/members/${S.uid}`, {method: 'DELETE'}); S.filter = 'all'; closeSheet(); }), text: 'Выйти из группы'}))));
 }
 function settingsCard() {
  const u = (S.me && S.me.user) || {};
  const sum = h('input', {type: 'time', value: u.summary_time || '08:00', onchange: e => Sync.call('api/settings', {method: 'PUT', body: JSON.stringify({summary_time: e.target.value})}).then(() => toast('Сохранено')).catch(er => toast(er.message))});
  let th = 'auto'; try { th = localStorage.getItem('den5-theme') || 'auto'; } catch (e) {}
  const theme = h('select', {onchange: e => { try { localStorage.setItem('den5-theme', e.target.value); } catch (er) {} applyTheme(); }},
   [['auto', 'Как в системе'], ['light', 'Светлая'], ['dark', 'Тёмная']].map(([v, l]) => h('option', {value: v, selected: th === v}, l)));
  return h('section', null, h('h2', {class: 'sec-h', text: 'Настройки'}), h('div', {class: 'card pad'},
   field('Утренняя сводка в боте', sum), field('Тема', theme),
   h('button', {class: 'btn danger', onclick: async () => { if (!confirm('Выйти на этом устройстве? Неотправленные изменения пропадут.')) return; try { await Sync.call('api/logout', {method: 'POST', body: '{}'}); } catch (e) {} Platform.setToken(null); location.reload(); }, text: 'Выйти на этом устройстве'})));
 }
 function exportCard() {
  const pid = S.filter === 'all' ? personal().id : S.filter;
  const go = async fmt => { try { const r = await Sync.call('api/export-link', {method: 'POST', body: JSON.stringify({format: fmt, planner_id: pid})}); Platform.download(new URL(r.path, Platform.api).toString(), 'planner.' + fmt); } catch (e) { toast(e.message); } };
  const chat = async fmt => { try { await Sync.call('api/export', {method: 'POST', body: JSON.stringify({format: fmt, planner_id: pid})}); toast('Файл отправлен в чат с ботом'); } catch (e) { toast(e.message); } };
  return h('section', null, h('h2', {class: 'sec-h', text: 'Выгрузка'}), h('div', {class: 'card pad'}, h('div', {class: 'btns'},
   ['csv', 'ics', 'json'].map(f => h('button', {class: 'btn', onclick: () => Platform.canPushToChat ? chat(f) : go(f), text: f.toUpperCase() + (Platform.canPushToChat ? ' → в чат' : '')})))));
 }
 function applyTheme() {
  if (Platform.kind === 'telegram') return;
  let th = 'auto'; try { th = localStorage.getItem('den5-theme') || 'auto'; } catch (e) {}
  if (th === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = th;
 }

 // ---------- smart input preview ----------
 function renderPreview() {
  const box = $('#preview'); box.replaceChildren();
  const text = $('#compose').value;
  if (!text.trim()) { S.draft = null; return; }
  const p = Core.parse(text, Date.now(), S.planners);
  const removed = (S.draft && S.draft.removed) || [];
  S.draft = {p, removed};
  for (const t of p.tokens) if (!removed.includes(t.kind)) box.append(h('button', {'aria-label': 'Убрать: ' + t.label, onclick: () => { S.draft.removed.push(t.kind); renderPreview(); }, text: t.label}));
 }

 // ---------- boot ----------
 async function boot() {
  Platform.ready(); applyTheme();
  document.getElementById('compose').addEventListener('input', () => { if (S.draft) S.draft.removed = S.draft.removed.filter(() => true); renderPreview(); });
  document.getElementById('compose-form').addEventListener('submit', e => { e.preventDefault(); addFromInput(); });
  document.getElementById('sync').addEventListener('click', () => { S.tab = 'me'; render(); Sync.run(); });
  for (const b of document.querySelectorAll('[data-tab]')) b.addEventListener('click', () => { S.tab = b.dataset.tab; if (S.tab === 'cal') loadEvents(); render(); });
  addEventListener('resize', () => render());
  Sync.config({api: Platform.api, onStatus: st => { if (st.state === 'notice') return toast(st.text); S.sync = st; renderSync(); },
   onChanged: () => reload(), onAuth: async () => { if (Platform.kind === 'telegram' || Platform.kind === 'max') { Platform.setToken(null); try { const t = await Platform.auth(true); Sync.config({token: t}); Sync.poke(); } catch (e) {} } }});

  let token = null;
  try { token = await Platform.auth(); } catch (e) { toast(e.message); }
  const pairCode = Platform.pairCodeFromLink();
  let last = null; try { last = localStorage.getItem('den5-scope'); } catch (e) {}
  if (!token && Platform.kind === 'web' && !last) return welcome(pairCode);
  // 1) open local data first (instant), 2) then talk to the server
  const scope = token ? (last && last.startsWith('u') ? last : 'pending') : (Platform.kind === 'file' ? 'file-' + (Platform.CFG.user_id || 'x') : 'local');
  await openScope(scope);
  if (Platform.kind === 'file' && Platform.CFG.snapshot && !(await Store.getMeta('seeded'))) {
   const snap = Platform.CFG.snapshot;
   await Store.settle([], snap.tasks, [], {planners: snap.planners, seeded: true});
   S.uid = Platform.CFG.user_id; await reload();
  }
  if (!token) { S.offlineOnly = true; S.uid = S.uid ?? Platform.CFG.user_id ?? 0; await ensureLocalPlanner(); render(); if (pairCode) claimSheet(pairCode); return; }
  Sync.config({token});
  try {
   const me = await Sync.call('api/me');
   const want = 'u' + me.user.id;
   let from = null; try { from = localStorage.getItem('den5-migrate-from'); } catch (e) {}
   if (!from && Store.scope === 'pending') from = 'pending';  // first start: data written before the account was known
   if (from && from !== want) await migrateFrom(from, want, me);
   if (Store.scope !== want) await openScope(want);
   try { localStorage.setItem('den5-scope', want); } catch (e) {}
   S.me = me; S.uid = me.user.id; S.planners = me.planners; await Store.setMeta({planners: me.planners, me});
   render(); Sync.run(); loadEvents();
   if (pairCode) claimSheet(pairCode);
  } catch (e) {
   const me = await Store.getMeta('me');
   if (me) { S.me = me; S.uid = me.user.id; S.planners = me.planners; }
   render(); Sync.run();
  }
 }
 async function openScope(scope) {
  const mode = await Store.open(scope);
  S.tasks = new Map((await Store.allTasks()).map(t => [t.id, t]));
  S.planners = (await Store.getMeta('planners')) || S.planners;
  const me = await Store.getMeta('me'); if (me) { S.me = me; S.uid = me.user.id; }
  if (mode === 'memory') toast('Хранилище браузера недоступно: данные живут только в этом окне', null, 8000);
  render();
 }
 /** Tasks made before connecting (no login / local file) move into the account — after an explicit yes. */
 async function migrateFrom(from, to, me) {
  try { localStorage.removeItem('den5-migrate-from'); } catch (e) {}
  await Store.open(from);
  const oldTasks = (await Store.allTasks()).filter(t => !t.deleted);
  const oldOps = await Store.outbox();
  const fresh = oldTasks.filter(t => !t.rev);
  if (!fresh.length && !oldOps.length) return;
  const n = new Set([...fresh.map(t => t.id), ...oldOps.map(o => o.id)]).size;
  if (!confirm(`На этом устройстве есть ${n} задач(и), сделанных без входа. Перенести их в ваш аккаунт?`)) return;
  const personalId = (me.planners.find(p => p.kind === 'personal') || {}).id;
  const fix = pid => (me.planners.some(p => p.id === pid) ? pid : personalId);
  await Store.open(to);
  const tasks = [], ops = [];
  fresh.sort((a, b) => (a.parent_id ? 1 : 0) - (b.parent_id ? 1 : 0));  // parents are created before subtasks
  for (const t of fresh) {
   const nt = Object.assign({}, t, {planner_id: fix(t.planner_id), created_by: me.user.id});
   tasks.push(nt);
   const fields = {title: nt.title, notes: nt.notes || '', priority: nt.priority, status: nt.status};
   if (nt.date) fields.due = {date: nt.date, time: nt.time};
   if (nt.repeat && nt.date) fields.repeat = nt.repeat;
   if (nt.parent_id) fields.parent_id = nt.parent_id;
   ops.push({op_id: Core.uuid(), id: nt.id, op: {op_id: Core.uuid(), type: 'create', id: nt.id, planner_id: nt.planner_id, fields}});
  }
  for (const o of oldOps) if (o.op.type !== 'create') ops.push({op_id: o.op_id, id: o.id, op: o.op});  // edits of snapshot tasks
  await Store.commit(tasks, ops);
 }
 async function ensureLocalPlanner() {
  if (!S.planners.length) { S.planners = [{id: -1, kind: 'personal', name: 'Личное', role: 'owner'}]; await Store.setMeta({planners: S.planners}); }
 }
 function welcome(pairCode) {
  $('#app').classList.add('hidden');
  const w = h('main', {class: 'welcome'}, h('h1', {text: 'День'}), h('p', {class: 'muted', text: 'Простой ежедневник: Telegram, MAX, браузер и файл на устройстве — одни и те же дела.'}),
   h('a', {class: 'btn primary block', href: '/login'}, 'Войти через Telegram'),
   h('button', {class: 'btn block', onclick: () => { w.remove(); $('#app').classList.remove('hidden'); startLocal().then(() => claimSheet(pairCode)); }, text: 'У меня есть код подключения'}),
   h('button', {class: 'btn block', onclick: () => { w.remove(); $('#app').classList.remove('hidden'); startLocal(); }, text: 'Начать без входа (только это устройство)'}));
  document.body.append(w);
  if (pairCode) { w.remove(); $('#app').classList.remove('hidden'); startLocal().then(() => claimSheet(pairCode)); }
 }
 async function startLocal() {
  try { localStorage.setItem('den5-scope', 'local'); } catch (e) {}
  await openScope('local'); S.offlineOnly = true; S.uid = 0; await ensureLocalPlanner(); render();
 }
 window.DenApp = {S, render, edit, nextOccurrence};
 boot();
})();
