<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1D1A" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>День</title>

<script>
/* SDK мессенджера грузим только внутри мессенджера (Telegram передаёт #tgWebAppData, MAX — #WebAppData) */
(function(){if(window.Telegram&&window.Telegram.WebApp)return;var h=location.hash,s='';try{s=sessionStorage.getItem('__telegram__initParams')||''}catch(e){}
if(/tgWebAppData/.test(h)||/tgWebAppData/.test(s))document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
else if(/(^|[#&])WebAppData=/.test(h))document.write('<script src="https://st.max.ru/js/max-web-app.js"><\/script>');})();
</script>
<style>/* «День» — тетрадь и маркер, мягкая версия. Одна геометрия для светлой и тёмной темы, меняются только переменные.
   Контраст: текст ≥ 4.5:1 к фону, белый на основной кнопке ≥ 4.5:1. */
:root{
 --paper:#F7F4EE;--dots:#E3DDD0;--card:#FFFDF8;--card-2:#EFEAE0;--line:#E2DBCE;
 --ink:#2E2C28;--muted:#666158;--faint:#857F74;
 --marker:#F3D873;--marker-soft:#FBF0C9;--tomato:#B0553C;--tomato-ink:#8E4330;--tomato-soft:#F6E3DA;--leaf:#3F7D60;--leaf-ink:#2F5A46;--leaf-soft:#E4EEE7;--sky:#3E6CC0;
 --violet-soft:#E8E6F2;--violet-ink:#5A5486;
 --on-tomato:#FFFFFF;--shadow:0 1px 0 var(--line),0 12px 30px -20px rgba(46,44,40,.28);
 --r:18px;--tap:48px;--spring:cubic-bezier(.3,1.25,.6,1);--ease:cubic-bezier(.2,.8,.2,1);
 --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;--f-head:"Unbounded","Onest",system-ui,sans-serif;--f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --paper:#1E1D1A;--dots:#2C2A26;--card:#262521;--card-2:#2F2D29;--line:#3A3833;
 --ink:#ECE7DD;--muted:#ABA597;--faint:#8C877E;
 --marker:#E3C766;--marker-soft:#3A3524;--tomato:#E08A70;--tomato-ink:#F0A992;--tomato-soft:#45291F;--leaf:#6DB892;--leaf-ink:#A8D4BC;--leaf-soft:#23362C;--sky:#8FB0F0;
 --violet-soft:#33304A;--violet-ink:#C2BDEB;
 --on-tomato:#1E1D1A;--shadow:0 1px 0 #00000040,0 14px 34px -22px #000;color-scheme:dark}}
:root[data-theme=dark]{
 --paper:#1E1D1A;--dots:#2C2A26;--card:#262521;--card-2:#2F2D29;--line:#3A3833;
 --ink:#ECE7DD;--muted:#ABA597;--faint:#8C877E;
 --marker:#E3C766;--marker-soft:#3A3524;--tomato:#E08A70;--tomato-ink:#F0A992;--tomato-soft:#45291F;--leaf:#6DB892;--leaf-ink:#A8D4BC;--leaf-soft:#23362C;--sky:#8FB0F0;
 --violet-soft:#33304A;--violet-ink:#C2BDEB;
 --on-tomato:#1E1D1A;--shadow:0 1px 0 #00000040,0 14px 34px -22px #000;color-scheme:dark}

@font-face{font-family:'Caveat';font-style:normal;font-weight:500 700;font-display:swap;src:url(fonts/caveat-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Caveat';font-style:normal;font-weight:500 700;font-display:swap;src:url(fonts/caveat-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Onest';font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/onest-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Onest';font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/onest-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:500 800;font-display:swap;src:url(fonts/unbounded-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:500 800;font-display:swap;src:url(fonts/unbounded-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{font-size:100%;-webkit-text-size-adjust:100%}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
body{background:var(--paper) radial-gradient(var(--dots) 1px,transparent 1.4px) 0 0/22px 22px;color:var(--ink);font:1rem/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
a{color:var(--sky)}
::selection{background:var(--marker);color:#2E2C28}
:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden,[hidden]{display:none!important}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hand{font-family:var(--f-hand);font-weight:600;letter-spacing:.01em}
.hl{background:linear-gradient(transparent 52%,var(--marker) 52%,var(--marker) 90%,transparent 90%) no-repeat 0 0/0% 100%;animation:sweep .7s .2s var(--ease) forwards;padding:0 .08em;margin:0 -.08em;color:inherit}
@keyframes sweep{to{background-size:100% 100%}}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100dvh;max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;padding-top:max(10px,env(safe-area-inset-top))}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:3px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 15px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:0.875rem;white-space:nowrap;transition:transform .2s var(--spring),background .2s,border-color .2s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sync{flex:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:0.7812rem;font-weight:600;color:var(--muted);max-width:48%}
.sync .dot{position:relative;width:9px;height:9px;border-radius:50%;background:var(--leaf);flex:none}
.sync[data-state=sending] .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--marker);border-top-color:transparent;animation:spin .9s linear infinite}
.sync[data-state=sending] .dot,.sync[data-state=pending] .dot,.sync[data-state=local] .dot{background:#E0A800}
.sync[data-state=auth] .dot,.sync[data-state=memory] .dot,.sync[data-state=rejected] .dot{background:var(--tomato);animation:blink 1.4s ease-in-out infinite}
.sync span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.35}}

.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr;overflow:hidden}
.side{display:none}
.view{overflow-y:auto;padding:2px 16px 20px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.view>*{animation:viewin .32s var(--ease) both}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}}

/* ---------- headings ---------- */
.greet{margin:10px 4px 2px;font-size:1.5625rem;color:var(--tomato);transform:rotate(-1.2deg);transform-origin:left}
h1.title{margin:0 4px 14px;font:800 1.875rem/1.08 var(--f-head);letter-spacing:-.03em}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:18px 4px 8px;font:700 0.8125rem/1 var(--f-head);letter-spacing:.02em;text-transform:lowercase}
.sec-h .n{font:600 1.25rem/1 var(--f-hand);color:var(--muted)}
.sec-h.warn{color:var(--tomato)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;overflow:hidden}

/* ---------- task row ---------- */
.task{position:relative;display:flex;align-items:flex-start;gap:2px;padding:6px 6px 6px 2px;min-height:58px;background:var(--card);touch-action:pan-y;
 animation:rowin .35s var(--ease) both;animation-delay:calc(var(--i,0)*35ms);transition:transform .2s var(--ease),opacity .25s}
@keyframes rowin{from{opacity:0;transform:translateY(8px)}}
.task+.task{border-top:1.5px dashed var(--line)}
.task.leaving{animation:rowout .32s var(--ease) forwards}
@keyframes rowout{to{opacity:0;transform:translateX(30px);max-height:0;min-height:0;padding:0}}
.check{width:var(--tap);height:var(--tap);flex:none;display:flex;align-items:center;justify-content:center}
.check .box{width:26px;height:26px;border-radius:9px 11px 8px 12px;border:2.2px solid var(--ink);transform:rotate(-3deg);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .25s var(--spring)}
.check:hover .box{background:var(--marker-soft)}
.check:active .box{transform:rotate(-3deg) scale(.82)}
.check svg{width:20px;height:20px;stroke:var(--paper);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24}
.task.done .check .box{background:var(--leaf);border-color:var(--leaf)}
.task.done .check svg{stroke-dashoffset:0;transition:stroke-dashoffset .35s .05s var(--ease)}
.t-main{flex:1;min-width:0;padding:8px 2px;text-align:left;display:flex;flex-direction:column;gap:5px}
.t-title{position:relative;font-size:1rem;font-weight:500;overflow-wrap:anywhere;align-self:flex-start}
.t-title::after{content:"";position:absolute;left:-2px;right:-2px;top:55%;height:2.2px;border-radius:2px;background:var(--ink);transform:scaleX(0) rotate(-1deg);transform-origin:left;transition:transform .35s var(--ease)}
.task.done .t-title{color:var(--faint)}
.task.done .t-title::after{transform:scaleX(1) rotate(-1deg);background:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:0.8125rem;color:var(--muted);align-items:center}
.tag{padding:1px 9px;border-radius:999px;background:var(--card-2);color:var(--muted);font-weight:600}
.tag.time{background:none;padding:0;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.tag.time.late{color:var(--tomato-ink)}
.task.fresh{animation:fresh 1.4s var(--ease)}
@keyframes fresh{0%{background:var(--marker-soft)}100%{background:var(--card)}}
.tag.hi{background:var(--marker-soft);color:var(--ink)}
.tag.late{background:var(--tomato-soft);color:var(--tomato-ink)}
.tag.conf,.tag.rej{background:var(--tomato);color:var(--on-tomato)}
.tag.grp{background:var(--leaf-soft);color:var(--leaf-ink)}
.tag.grp.team{background:var(--violet-soft);color:var(--violet-ink)}
.tag.ask{background:var(--marker-soft);color:var(--ink)}
.tag.no{background:var(--tomato-soft);color:var(--tomato-ink)}
.tag.yes{background:var(--leaf-soft);color:var(--leaf-ink)}
.t-no{font:600 .8125rem/1 var(--f-body);color:var(--faint);font-variant-numeric:tabular-nums;margin-right:6px}
.task.mine-ask{background:var(--marker-soft)}
.tag.pend{background:none;padding:0;color:var(--faint);font-family:var(--f-hand);font-size:1rem}
.t-act{flex:none;min-width:var(--tap);height:var(--tap);border-radius:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:0.8125rem;font-weight:700;padding:0 10px}
.t-act:hover{background:var(--card-2);color:var(--ink)}
.empty{padding:30px 20px 26px;text-align:center;color:var(--muted)}
.empty svg{width:120px;height:80px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.empty svg .sun{stroke:var(--tomato);stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.2s .2s var(--ease) forwards}
.empty b{display:block;color:var(--ink);font:600 1.75rem/1.1 var(--f-hand);margin-bottom:4px}
@keyframes draw{to{stroke-dashoffset:0}}
details.fold>summary{list-style:none;cursor:pointer;min-height:var(--tap);display:flex;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin-left:8px;transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(225deg)}

/* ---------- streak pill & search ---------- */
.mini-row{display:flex;gap:8px;align-items:center;margin:0 4px 6px;flex-wrap:wrap}
.streak{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:0.875rem}
.streak svg{width:16px;height:16px;fill:var(--tomato);stroke:none}
.search{display:flex;align-items:center;gap:8px;flex:1;min-width:180px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line)}
.search input{flex:1;min-width:0;min-height:42px;border:0;background:none;outline:none;font-size:0.9375rem}

/* ---------- smart input + bottom nav ---------- */
.dock{padding:8px 12px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 18%)}
.compose{display:flex;gap:8px;align-items:center}
.compose input{flex:1;min-width:0;height:52px;padding:0 20px;border-radius:26px;border:1.5px solid var(--line);background:var(--card);font-size:1rem;outline:none;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .25s}
.compose input:focus{border-color:var(--faint);box-shadow:0 0 0 4px var(--marker-soft),var(--shadow)}
.compose input::placeholder{color:var(--faint)}
.send,.mic{width:52px;height:52px;flex:none;border-radius:26px;display:flex;align-items:center;justify-content:center;transition:transform .18s var(--ease),background .2s}
.send{background:var(--tomato);color:var(--on-tomato)}
.send:active,.mic:active{transform:scale(.93)}
.send svg{stroke:var(--on-tomato);stroke-width:2.4}
.mic{position:relative;background:var(--ink);color:var(--paper)}
.mic svg{stroke:var(--paper)}
.mic::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--tomato);opacity:0;z-index:-1}
.mic[aria-pressed=true]{background:var(--tomato)}
.mic[aria-pressed=true]::before{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.7);opacity:0}}
.listen{display:flex;align-items:center;gap:10px;margin:0 2px 8px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);animation:rowin .3s var(--ease) both}
.listen .wave{display:flex;gap:4px;align-items:center;height:26px}
.listen .wave i{display:block;width:4px;height:24px;border-radius:2px;background:var(--tomato);animation:wave 1s ease-in-out infinite}
.listen .wave i:nth-child(2){animation-delay:.12s}.listen .wave i:nth-child(3){animation-delay:.24s}.listen .wave i:nth-child(4){animation-delay:.36s}
@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.listen b{font:600 1.375rem/1.15 var(--f-hand)}
.ctx{margin:0 4px 6px;font:600 1.125rem/1 var(--f-hand);color:var(--tomato)}
.preview{display:flex;flex-wrap:wrap;gap:6px;padding:8px 2px 0}
.preview:empty{display:none}
.preview button{min-height:36px;padding:0 12px;border-radius:10px;background:var(--marker-soft);color:var(--ink);font-size:0.8438rem;font-weight:700;transform:rotate(-1deg);animation:pop .3s var(--spring) both}
.preview button:nth-child(2n){transform:rotate(1deg)}
.preview button::after{content:" ×";opacity:.55}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.input-err{margin:6px 4px 0;color:var(--tomato);font-size:0.8438rem;font-weight:600}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px;padding:4px;border-radius:20px;background:var(--card);border:1.5px solid var(--line)}
.tabs .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:16px;background:var(--marker-soft);transition:transform .4s var(--ease);z-index:0}
.tabs button{position:relative;z-index:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:0.75rem;font-weight:700;color:var(--muted);border-radius:16px}
.tabs button[aria-current=page]{color:var(--ink)}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 10px}
.cal-head h2{margin:0;font:700 1.1875rem/1 var(--f-head);text-transform:lowercase}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn:hover{background:var(--card-2)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{text-align:center;font-size:0.75rem;color:var(--muted);padding:4px 0;font-weight:600}
.day{position:relative;aspect-ratio:1;min-height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.9375rem;background:var(--card);border:1.5px solid var(--line);overflow:hidden;isolation:isolate}
.day::before{content:"";position:absolute;inset:14% 8%;border-radius:40% 55% 45% 60%/55% 40% 60% 45%;background:var(--marker);transform:scaleX(0) rotate(var(--rot,-4deg));transform-origin:left;z-index:-1;opacity:var(--paint,0);transition:transform .5s var(--ease);transition-delay:calc(var(--d,0)*22ms)}
.day.painted::before{transform:scaleX(1) rotate(var(--rot,-4deg))}
.day.out{opacity:.35}
.day.today{border-color:var(--ink);border-width:2px}
.day[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day[aria-pressed=true]::before{opacity:.0}
.day .dots{position:absolute;bottom:4px;display:flex;gap:2px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--tomato)}
.day .star{position:absolute;top:2px;right:3px;width:12px;height:12px;fill:var(--tomato);animation:pop .4s var(--spring) both}
.event{display:flex;gap:10px;padding:11px 14px;font-size:0.9375rem}
.event+.event,.event+.task,.task+.event{border-top:1.5px dashed var(--line)}
.event b{color:var(--sky);font-weight:700;min-width:90px;font-variant-numeric:tabular-nums}

/* ---------- profile, forms ---------- */
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 16px;width:100%;text-align:left;color:inherit;text-decoration:none}
.row+.row{border-top:1.5px dashed var(--line)}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:0.8438rem}
button.row:hover,a.row:hover{background:var(--card-2)}
.btn{min-height:var(--tap);padding:0 18px;border-radius:14px;background:var(--card-2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);transition:transform .15s var(--spring)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--tomato);color:var(--on-tomato);border-color:transparent}
.btn.ok{background:var(--leaf);color:#fff;border-color:transparent}
.btn.danger{color:var(--tomato-ink);background:var(--tomato-soft);border-color:transparent}
.btn.ghost{background:none}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:0.8438rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{min-height:var(--tap);padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:1rem;font-weight:400}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.field textarea{min-height:96px;resize:vertical}
.code{font:700 1.875rem/1.2 var(--f-head);letter-spacing:.16em;text-align:center;padding:16px;border-radius:14px;background:var(--marker-soft);color:var(--ink)}
.pad{padding:16px}
.muted{color:var(--muted)}
.note{font:600 1.1875rem/1.25 var(--f-hand);color:var(--muted)}
.warn-box{padding:14px 16px;border-radius:16px;background:var(--tomato-soft);color:var(--ink)}
.switch{position:relative;width:56px;height:34px;flex:none;border-radius:999px;background:var(--card-2);border:1.5px solid var(--line);transition:background .2s}
.switch::before{content:"";position:absolute;inset:-6px -2px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--faint);transition:transform .3s var(--spring),background .2s}
.switch[aria-checked=true]{background:var(--leaf)}
.switch[aria-checked=true]::after{transform:translateX(22px);background:#fff}

/* ---------- game ---------- */
.game{padding:18px;display:flex;flex-direction:column;gap:14px}
.lvl{display:flex;align-items:center;gap:14px}
.badge-lvl{width:62px;height:62px;flex:none;border-radius:18px 22px 16px 24px;background:var(--marker-soft);color:var(--ink);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 1.5rem/1 var(--f-head);transform:rotate(-4deg)}
.badge-lvl small{font:600 0.9375rem/1 var(--f-hand)}
.bar{height:12px;border-radius:999px;background:var(--card-2);overflow:hidden;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--tomato) 0 8px,color-mix(in srgb,var(--tomato) 75%,#fff) 8px 16px);border-radius:999px;transition:width .8s var(--ease);animation:stripes 1.2s linear infinite}
@keyframes stripes{to{background-position:22px 0}}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px 8px;border-radius:14px;background:var(--card-2);text-align:center}
.stat b{display:block;font:800 1.375rem/1.1 var(--f-head)}
.stat small{color:var(--muted);font-size:0.7812rem}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ach div{padding:11px 12px;border-radius:14px;background:var(--card-2);font-size:0.8125rem;border:1.5px dashed var(--line)}
.ach div.got{background:var(--leaf-soft);border-style:solid;border-color:var(--leaf)}
.ach div:not(.got){opacity:.6}
.ach b{display:block;font-size:0.875rem}
.fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fx i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--ink);animation:splash .7s var(--ease) forwards}
.fx i:nth-child(3n){background:var(--tomato)}.fx i:nth-child(4n){background:var(--leaf)}
.fx .xp{position:absolute;font:700 1.875rem/1 var(--f-hand);color:var(--tomato);animation:rise 1s var(--ease) forwards}
@keyframes splash{from{transform:translate(0,0) scale(1.2)}to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:.2}}
@keyframes rise{from{transform:translateY(0) rotate(-6deg) scale(.6)}30%{transform:translateY(-20px) rotate(-6deg) scale(1.15)}to{transform:translateY(-60px) rotate(-6deg);opacity:0}}

/* ---------- sheet & toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,29,26,.32);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.scrim.closing{animation:fade .2s reverse both}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px -20px rgba(0,0,0,.35);animation:up .4s var(--ease) both}
.scrim.closing .sheet{animation:down .22s var(--ease) both}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes down{to{transform:translateY(100%)}}
.sheet .grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{margin:0 0 14px;font:800 1.375rem/1.15 var(--f-head);letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:calc(158px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 10px 10px 16px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:0.9062rem;font-weight:600;animation:toast .4s var(--spring) both}
@keyframes toast{from{transform:translate(-50%,20px);opacity:0}}
.toast button{min-height:44px;padding:0 14px;border-radius:10px;background:var(--marker);color:#2E2C28;font-weight:800}
body.sheet-open .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top))}   /* never on top of the card's fields */

/* ---------- auth (welcome / sign-in sheet) ---------- */
.auth{display:flex;flex-direction:column;gap:12px}
.auth-tabs{display:flex;gap:6px;flex-wrap:wrap}
.auth-tabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:0.875rem;background:var(--card)}
.auth-tabs button{min-height:44px}
.auth-tabs button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.auth .msg{min-height:20px;font-size:0.875rem;font-weight:600}
.auth .msg.err{color:var(--tomato)}
.welcome{max-width:460px;margin:6vh auto;padding:0 18px;display:flex;flex-direction:column;gap:14px}
.welcome h1{font:800 2.75rem/1 var(--f-head);letter-spacing:-.04em;margin:0}

/* ---------- people, history, theme ---------- */
.people{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}
.people button{min-height:40px;padding:0 12px;border-radius:999px;background:var(--violet-soft);color:var(--violet-ink);font-weight:600;font-size:.875rem;animation:pop .25s var(--ease) both}
.people button.add{background:var(--card-2);color:var(--muted)}
.answer{padding:14px;border-radius:16px;background:var(--marker-soft);margin-bottom:14px;display:flex;flex-direction:column;gap:10px;animation:rowin .3s var(--ease) both}
.answer.no{background:var(--tomato-soft)}.answer.yes{background:var(--leaf-soft)}
.hist{margin:0;padding:0;list-style:none;font-size:.875rem;color:var(--muted)}
.hist li{padding:6px 0;border-top:1px dashed var(--line)}
.hist b{color:var(--ink);font-weight:600}
.theme-btn{flex:none;width:44px;height:44px;border-radius:22px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .3s var(--ease)}
.theme-btn:active{transform:rotate(-20deg) scale(.94)}
.inbox{display:flex;align-items:center;gap:10px;margin:0 4px 12px;padding:12px 14px;border-radius:16px;background:var(--marker-soft);width:calc(100% - 8px);text-align:left;animation:rowin .35s var(--ease) both}
.inbox b{flex:1}

/* ---------- wide screens ---------- */
@media (min-width:900px){
 .body{grid-template-columns:350px 1fr;gap:18px;padding:0 18px}
 .side{display:block;overflow-y:auto;padding:4px 0 18px}
 .view{padding:2px 0 18px}
 .tabs{display:none}
 .dock{padding:10px 18px 18px;margin-left:368px}
 .scrim{align-items:center}
 .sheet{border-radius:28px;border-bottom:2px solid var(--ink)}
 .side-nav{display:flex;gap:8px;margin-bottom:10px}
}
@media (max-width:899px){.side-nav{display:none}}
.app>.dock{order:3}.app>.body{order:2}   /* the input comes right after the header in Tab order, even on wide screens */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

   if (!(await Platform.ask(`В копии ${valid.length} дел, новых для этого устройства — ${fresh.length}. Добавить их в «${pname(personal())}»?`))) return;

     priority: ['normal', 'high', 'low'].includes(t.priority) ? t.priority : 'normal', status: t.status === 'done' ? 'done' : 'open', deleted: false,

    const fields = {title: nt.title, notes: nt.notes, priority: nt.priority, status: nt.status};

 async function inlineFonts(html) {
  for (const name of [...new Set(html.match(/\/fonts\/[a-z]+-(?:cyrillic|latin)\.woff2/g) || [])]) {
   try {
    const r = await fetch(name); if (!r.ok) continue;
    const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; r.blob().then(b => fr.readAsDataURL(b), rej); });

   } catch (e) {}
  }
  return html;

  const box = add(h('div', {class: 'card'}),
   sw(pref('game', 'on') === 'on', 'Игра «Закрась месяц»', () => { setPref('game', pref('game', 'on') === 'on' ? 'off' : 'on'); S.memo = null; render(); }),
   h('div', {class: 'row'}, h('span', {class: 'grow', text: 'Тема'}), theme));
  if (!S.offlineOnly && Platform.getToken()) {
   const sum = h('input', {type: 'time', value: u.summary_time || '08:00', 'aria-label': 'Утренняя сводка', style: {minHeight: '40px', border: '1.5px solid var(--line)', borderRadius: '12px', padding: '0 10px', background: 'var(--paper)'},
    onchange: e => Sync.call('api/settings', {method: 'PUT', body: JSON.stringify({summary_time: e.target.value})}).then(() => toast('Сводка придёт в ' + e.target.value)).catch(er => toast(er.message))});
   box.append(h('div', {class: 'row'}, h('span', {class: 'grow'}, h('b', {text: 'Утренняя сводка'}), h('small', {text: 'бот пришлёт план на день'})), sum));
   const put = (body, ok) => Sync.call('api/settings', {method: 'PUT', body: JSON.stringify(body)}).then(() => { Object.assign(S.me.user, body); toast(ok); }).catch(er => toast(er.message));
   const ZONES = ['Europe/Kaliningrad', 'Europe/Moscow', 'Europe/Samara', 'Asia/Yekaterinburg', 'Asia/Omsk', 'Asia/Novosibirsk', 'Asia/Krasnoyarsk', 'Asia/Irkutsk', 'Asia/Yakutsk', 'Asia/Vladivostok', 'Asia/Magadan', 'Asia/Kamchatka'];
   const curTZ = u.tz || Core.TZ; if (!ZONES.includes(curTZ)) ZONES.push(curTZ);
   const tz = h('select', {'aria-label': 'Часовой пояс', onchange: e => { Core.setTZ(e.target.value); S.memo = null; put({tz: e.target.value}, 'Время теперь по поясу ' + e.target.value); render(); }},
    ZONES.map(z => h('option', {value: z, selected: z === curTZ}, z.split('/')[1].replace('_', ' '))));
   const off = h('select', {'aria-label': 'Напоминать по умолчанию', onchange: e => put({default_offset: +e.target.value}, 'Новые дела будут напоминать ' + e.target.selectedOptions[0].textContent)},
    REMINDS.filter(([v]) => [0, 5, 15, 30, 60, 120, 1440].includes(v)).map(([v, l]) => h('option', {value: String(v), selected: (u.default_offset || 0) === v}, l)));
   box.append(h('div', {class: 'row'}, h('span', {class: 'grow'}, h('b', {text: 'Часовой пояс'}), h('small', {text: 'дела со временем показываются по нему'})), tz),
    h('div', {class: 'row'}, h('span', {class: 'grow'}, h('b', {text: 'Напоминать'}), h('small', {text: 'для новых дел со временем'})), off));
   const where = u.telegram_chat ? 'в Telegram' : (S.me.email && S.me.smtp ? 'на почту ' + S.me.email : null);
   box.append(h('div', {class: 'row'}, h('span', {class: 'grow'}, h('b', {text: 'Куда приходят напоминания'}),
    h('small', {text: where || 'пока никуда: подключите Telegram (/link в боте) или привяжите почту'}))));
   if (window.Notification) box.append(sw(pref('notify', 'off') === 'on' && Notification.permission === 'granted', 'Уведомлять в браузере о назначениях', async () => {
    if (pref('notify', 'off') === 'on') { setPref('notify', 'off'); return render(); }
    const ok = await Notification.requestPermission(); setPref('notify', ok === 'granted' ? 'on' : 'off'); render();
   }));
  }
  return h('section', null, h('h2', {class: 'sec-h', text: 'настройки'}), box);
 }
 function exportCard() {
  const pid = S.filter === 'all' ? personal().id : S.filter;
  const go = async fmt => { try { const r = await Sync.call('api/export-link', {method: 'POST', body: JSON.stringify({format: fmt, planner_id: pid})}); Platform.download(new URL(r.path, Platform.api).toString(), 'planner.' + fmt); } catch (e) { toast(e.message); } };
  const chat = async fmt => { try { await Sync.call('api/export', {method: 'POST', body: JSON.stringify({format: fmt, planner_id: pid})}); toast('Файл в чате с ботом'); } catch (e) { toast(e.message); } };
  return h('section', null, h('h2', {class: 'sec-h', text: 'выгрузить'}), h('div', {class: 'card pad'}, h('div', {class: 'btns'},
   [['csv', 'Таблица (CSV)'], ['ics', 'Календарь (ICS)'], ['json', 'Всё целиком (JSON)']].map(([f, l]) => h('button', {class: 'btn', onclick: () => Platform.canPushToChat ? chat(f) : go(f), text: l}))),
   Platform.canPushToChat ? h('p', {class: 'note', text: 'Файл придёт в чат с ботом.'}) : null));
 }
 const THEME_ICON = {auto: '<path d="M12 3a9 9 0 1 0 0 18z" fill="currentColor"/><circle cx="12" cy="12" r="9"/>',
  light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  dark: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'};
 function applyTheme() {
  const th = pref('theme', 'auto');
  Platform.theme(th);
  const b = $('#theme-btn');
  if (b) { b.replaceChildren(svg(THEME_ICON[th] || THEME_ICON.auto, 'i')); b.setAttribute('aria-label', `Тема: ${({auto: 'как в системе', light: 'светлая', dark: 'тёмная'})[th]}. Переключить`); }
 }
 function cycleTheme() {
  const next = {auto: 'light', light: 'dark', dark: 'auto'}[pref('theme', 'auto')] || 'auto';
  setPref('theme', next); applyTheme(); if (S.tab === 'me') render();
  toast({auto: 'Тема как в системе', light: 'Светлая тема', dark: 'Тёмная тема'}[next], null, 1600);
 }

 // ---------- smart input preview ----------
 const TOKEN_KIND = {date: 'date', priority: 'priority', repeat: 'repeat', planner: 'planner', remind: 'remind', assignee: 'assignee', mention: 'mention'};
 function renderPreview() {
  const box = $('#preview'); box.replaceChildren();
  const text = $('#compose').value;
  if (!text.trim()) { S.draft = null; return; }
  if (isCommand(text) && !(S.draft && S.draft.asTask)) { box.append(h('span', {class: 'muted', style: {fontSize: '.875rem', padding: '6px 2px'}, text: 'Это команда — выполню по Enter'})); return; }
  const p = Core.parse(text, Date.now(), S.planners);
  const removed = (S.draft && S.draft.removed) || [];
  S.draft = {removed, asTask: !!(S.draft && S.draft.asTask)};
  for (const t of p.tokens) if (!removed.includes(TOKEN_KIND[t.kind])) box.append(h('button', {type: 'button', 'aria-label': 'Не учитывать: ' + t.label, onclick: () => { S.draft.removed.push(TOKEN_KIND[t.kind]); renderPreview(); $('#compose').focus(); }, text: t.label}));
 }

 // ---------- boot ----------
 async function boot() {
  Platform.ready(); applyTheme();
  $('#compose').addEventListener('input', () => { if (S.draft && S.draft.asTask && !$('#compose').value) S.draft = null; renderPreview(); });
  $('#theme-btn').addEventListener('click', cycleTheme);
  $('#mic').addEventListener('click', toggleVoice);
  document.addEventListener('keydown', e => {   // desktop: N — new, / — search, V — voice
   if (e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || S.sheet) return;
   if (e.key === 'n' || e.key === 'т') { e.preventDefault(); $('#compose').focus(); }
   else if (e.key === '/') { const s = document.querySelector('.search input'); if (s) { e.preventDefault(); s.focus(); } }
   else if (e.key === 'v' || e.key === 'м') { e.preventDefault(); toggleVoice(); }
  });
  $('#compose-form').addEventListener('submit', e => { e.preventDefault(); addFromInput(); });
  $('#sync').addEventListener('click', () => { S.tab = 'me'; render(); Sync.run(); });
  for (const b of document.querySelectorAll('[data-tab]')) b.addEventListener('click', () => { S.tab = b.dataset.tab; if (S.tab === 'cal') loadEvents(); render(); });
  matchMedia('(min-width:900px)').addEventListener('change', e => { S.wide = e.matches; render(); });  // only when the layout changes
  fetch(Platform.api + 'api/ping').then(r => r.json()).then(p => { S.ping = p; }).catch(() => {});
  Sync.config({api: Platform.api, onStatus: st => {
    S.sync = st; renderSync();
    if (st.rejected != null && st.rejected !== S.rejected.length) Store.getMeta('rejected', []).then(r => { S.rejected = r; render(); });
   },
   onChanged: () => reload(), onAuth: onAuthLost});

  let token = null;
  try { token = await Platform.auth(); } catch (e) { toast(e.message); }
  const pairCode = Platform.pairCodeFromLink();
  let last = null; try { last = localStorage.getItem('den5-scope'); } catch (e) {}
  if (!token && Platform.kind === 'web' && !last) return welcome(pairCode);
  const fileScope = 'file-' + (Platform.CFG.user_id || 'x');
  const scope = token ? (last && last.startsWith('u') ? last : 'pending') : (Platform.kind === 'file' ? fileScope : (last || 'local'));
  await openScope(scope);
  if (Platform.kind === 'file' && Platform.CFG.snapshot && !(await Store.getMeta('seeded'))) {
   const snap = Platform.CFG.snapshot;
   await Store.settle([], snap.tasks, [], {planners: snap.planners, seeded: true});
   if (Array.isArray(snap.queued) && snap.queued.length) await Store.commit([], snap.queued.filter(o => o && o.op && o.id));
   S.uid = Platform.CFG.user_id; await reload();
  }
  if (!token) { Core.setTZ(Core.localTZ()); S.offlineOnly = true; S.uid = S.uid ?? Platform.CFG.user_id ?? 0; await ensureLocalPlanner(); render(); return; }
  Sync.config({token});
  try {
   const me = await Sync.call('api/me');
   const want = 'u' + me.user.id;
   let from = null; try { from = localStorage.getItem('den5-migrate-from'); } catch (e) {}
   if (!from && Store.scope === 'pending') from = 'pending';
   if (from && from !== want) await migrateFrom(from, want, me);
   if (Store.scope !== want) await openScope(want);
   try { localStorage.setItem('den5-scope', want); } catch (e) {}
   S.me = me; S.uid = me.user.id; S.planners = me.planners; await Store.setMeta({planners: me.planners, me}); S.memo = null;
   Core.setTZ(me.user.tz || Core.localTZ());
   if (!me.user.tz) Sync.call('api/settings', {method: 'PUT', body: JSON.stringify({tz: Core.localTZ()})}).then(() => { me.user.tz = Core.localTZ(); }).catch(() => {});
   render(); Sync.run(); loadEvents();
   if (pairCode) sheet('Код подключения', authBox('code'));
  } catch (e) {
   if (e.auth) return onAuthLost();
   const me = await Store.getMeta('me'); if (me) { S.me = me; S.uid = me.user.id; S.planners = me.planners; Core.setTZ(me.user.tz || Core.localTZ()); }
   S.memo = null; render(); Sync.run();
  }
 }
 async function onAuthLost() {
  if (Platform.kind === 'telegram' || Platform.kind === 'max') {
   Platform.setToken(null);
   try { const t = await Platform.auth(true); Sync.config({token: t}); Sync.poke(); return; } catch (e) {}
  }
  // browser / file: the old key is gone, local data stays; sign in again right here
  Platform.setToken(null);
  sheet('Войдите ещё раз', add(h('div'), h('p', {class: 'note', text: 'Ключ этого устройства больше не действует — возможно, его отключили. Всё, что вы записали, на месте и отправится после входа.'}), authBox('pw')));
 }
 async function openScope(scope) {
  const mode = await Store.open(scope);
  S.tasks = new Map((await Store.allTasks()).map(t => [t.id, t]));
  S.planners = (await Store.getMeta('planners')) || S.planners;
  S.rejected = await Store.getMeta('rejected', []);
  const me = await Store.getMeta('me'); if (me) { S.me = me; S.uid = me.user.id; }
  if (mode === 'memory') toast('Браузер не даёт ничего сохранять — дела проживут, пока открыто это окно', null, 9000);
  S.memo = null; render();
 }
 /** Things written before signing in move into the account — after an explicit yes; repeatable until it succeeds. */
 async function migrateFrom(from, to, me) {
  await Store.open(from);
  const oldTasks = (await Store.allTasks()).filter(t => !t.deleted), oldOps = await Store.outbox();
  const fresh = oldTasks.filter(t => !t.rev);
  const clear = () => { try { localStorage.removeItem('den5-migrate-from'); } catch (e) {} };
  if (!fresh.length && !oldOps.length) return clear();
  const n = new Set([...fresh.map(t => t.id), ...oldOps.map(o => o.id)]).size;
  if (!(await Platform.ask(`Здесь есть ${n} дел, записанных до входа. Перенести их в ваш аккаунт?`))) return clear();
  const personalId = (me.planners.find(p => p.kind === 'personal') || {}).id;
  const fix = pid => (me.planners.some(p => p.id === pid) ? pid : personalId);
  fresh.sort((a, b) => (a.parent_id ? 1 : 0) - (b.parent_id ? 1 : 0));
  const tasks = [], ops = [];
  for (const t of fresh) {
   const nt = Object.assign({}, t, {planner_id: fix(t.planner_id), created_by: me.user.id});
   tasks.push(nt);
   const fields = {title: nt.title, notes: nt.notes || '', priority: nt.priority, status: nt.status};
   if (nt.date) fields.due = {date: nt.date, time: nt.time};
   if (nt.repeat && nt.date) fields.repeat = nt.repeat;
   if (nt.parent_id) fields.parent_id = nt.parent_id;
   if (nt.remind) fields.remind = nt.remind;
   const op = {op_id: Core.uuid(), type: 'create', id: nt.id, planner_id: nt.planner_id, fields};
   ops.push({op_id: op.op_id, id: nt.id, op});
  }
  for (const o of oldOps) if (o.op.type !== 'create') ops.push({op_id: o.op_id, id: o.id, op: o.op});
  await Store.open(to);
  await Store.commit(tasks, ops);
  clear();
  toast(`Перенёс ${tasks.length} дел в аккаунт`);
 }
 async function ensureLocalPlanner() {
  if (!S.planners.length) { S.planners = [{id: -1, kind: 'personal', name: 'Личное', role: 'owner'}]; await Store.setMeta({planners: S.planners}); }
 }
 function welcome(pairCode) {
  $('#app').classList.add('hidden');
  const box = h('div');
  const w = h('main', {class: 'welcome'}, h('p', {class: 'greet hand', text: greeting()}), h('h1', null, 'День'),
   h('p', {class: 'muted', text: 'Записывайте дела как обычно — «завтра в 10 позвонить в банк» — а напоминания и календарь сложатся сами.'}), box);
  document.body.append(w);
  AuthUI.mount(box, authOptions({startTab: pairCode ? 'code' : 'pw', code: pairCode, pairToken: null,
   onLocal: () => { w.remove(); $('#app').classList.remove('hidden'); startLocal(); }}));
 }
 async function startLocal() {
  const scope = Platform.kind === 'file' ? 'file-' + (Platform.CFG.user_id || 'x') : 'local';
  try { localStorage.setItem('den5-scope', scope); } catch (e) {}
  await openScope(scope); S.offlineOnly = true; S.uid = 0; await ensureLocalPlanner(); render();
 }
 window.DenApp = {S, render, edit, nextOccurrence};
 boot();
})();
